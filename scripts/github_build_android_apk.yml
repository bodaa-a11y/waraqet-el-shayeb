name: Build Android APK (ورقة الشايب)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://lzmpwjfgrtlypticedic.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_xYJ1BQgVUUiEVmLvcE3q2Q_hmmRTBxX

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk waraqet_el_shayeb_release.apk

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: waraqet-el-shayeb-apk
          path: waraqet_el_shayeb_release.apk
          retention-days: 30
