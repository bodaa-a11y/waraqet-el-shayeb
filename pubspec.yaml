name: el_shayeb_online
description: "ورقة الشايب | Waraqet El Shayeb — لعبة الكوتشينة المصرية الجماعية أونلاين"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.3
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.2
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/logo/
    - assets/images/themes/
    - assets/images/avatars/
